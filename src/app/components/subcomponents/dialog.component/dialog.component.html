<dialog class="modal" id="error_modal">
    <div class="modal-box">
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>
        <div class="alert alert-error alert-soft" role="alert">
            <svg class="h-6 w-6 shrink-0 stroke-current" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path [attr.d]="icon.crossInCircle" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
            </svg>
            <p class="whitespace-pre-line">{{ errorMessage }}</p>
        </div>
    </div>
    <form class="modal-backdrop" method="dialog">
        <button>close</button>
    </form>
</dialog>

<dialog class="modal" id="validation_modal">
    <div class="modal-box">
        <form method="dialog">
            <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
        </form>
        <div class="alert alert-error alert-soft flex flex-col" role="alert">
            @for (message of validationMessages?.messages; track message) {
                <p class="tooltip" [attr.data-tip]="message.causedBy">{{ message.content }}</p>
            }
        </div>
    </div>
    <form class="modal-backdrop" method="dialog">
        <button>close</button>
    </form>
</dialog>
