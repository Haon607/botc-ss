<div class="flex">
    <!--TODO edit custom character / convert character-->
    <!--TODO remove character-->
    <div>
        <img alt="img" class="size-20 rounded-box" src="{{character.details.image}}" />
    </div>
    <div class="flex flex-col">
        <div>
            <div>{{ character.details.name }}</div>
        </div>
        <p class="list-col-wrap text-xs">
            {{ character.details.ability }}
        </p>
    </div>
    <div class="grow"></div>
    <div class="flex flex-col">
        <button class="btn btn-square btn-ghost">
            <svg fill="currentColor" height="24px" viewBox="0 -960 960 960" width="24px" xmlns="http://www.w3.org/2000/svg">
                <path [attr.d]="isCustomCharacter ? editCustomCharacter : convertToCustomCharacter" />
            </svg>
        </button>
        <button class="btn btn-square btn-ghost">
            <svg fill="currentColor" height="24px" viewBox="0 -960 960 960" width="24px" xmlns="http://www.w3.org/2000/svg">
                <path [attr.d]="trash" />
            </svg>
        </button>
    </div>

</div>
